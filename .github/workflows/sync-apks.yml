name: Sync Xiaomi APKs

on:
  schedule:
    - cron: '15,45 * * * *'  # Runs every 30 minutes at off-peak minutes (:15 and :45)
  workflow_dispatch:       # Manual trigger from GitHub UI

permissions:
  contents: write  # Required for creating releases and pushing commits

concurrency:
  group: apk-sync
  cancel-in-progress: false  # Don't cancel running syncs

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run APK sync
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/main.py

      - name: Commit catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/apps.json data/state.json icons/
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: update APK catalog [skip ci]"
          git push
